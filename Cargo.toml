[workspace]
resolver = "3"
members = ["components/*", "apps/*"]
default-members = ["apps/webclassic-embedded-links"]

[workspace.dependencies]
getset = "0.1.6"
serde = { version = "1.0.228", features = ["derive"] }
snafu = "0.9.0"
tempfile = "3.27.0"
toml = "1.1.2"
minijinja = "2.0.0"
chrono = "0.4.44"
wait-timeout = "0.2.1"
