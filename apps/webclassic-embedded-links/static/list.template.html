<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Saved Links</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <h1>Saved Links</h1>
    {% if links %}
    <table>
        <thead>
            <tr><th>Code</th><th>URL</th></tr>
        </thead>
        <tbody>
        {% for link in links %}
            <tr>
                <td><a href="/s/{{ link.code }}">{{ link.code }}</a></td>
                <td>{{ link.url }}</td>
            </tr>
        {% endfor %}
        </tbody>
    </table>
    {% else %}
    <p>No links yet.</p>
    {% endif %}
    <p><a href="/">Back</a></p>
</body>
</html>
